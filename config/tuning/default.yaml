enabled: true

n_trials: 20

timeout: null

direction: maximize

metric: accuracy

use_optuna: true

use_grid_search: false

calibration:
  method: sigmoid
  n_bins: 10

metrics:
  accuracy:
    _target_: sklearn.metrics.accuracy_score
    _partial_: true
  f1_score:
    _target_: sklearn.metrics.f1_score
    _partial_: true
  precision:
    _target_: sklearn.metrics.precision_score
    _partial_: true
  recall:
    _target_: sklearn.metrics.recall_score
    _partial_: true