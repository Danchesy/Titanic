_target_: xgboost.XGBClassifier

n_estimators: 300

max_depth: 4

learning_rate: 0.05

eval_metric: logloss

use_label_encoder: false

random_state: ${seed}

is_cat: true

is_scale: false

grid_params:
  model__max_depth: [3, 4, 5]
  model__n_estimators: [100, 150, 200]
  model__learning_rate: [0.01, 0.05, 0.1]
  model__subsample: [0.6, 0.7, 0.8]