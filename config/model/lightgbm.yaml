defaults:
  - /preprocessing/encoder@encoder: ordinal
  - /preprocessing/scaler@scaler: null
  - _self_

_target_: lightgbm.LGBMClassifier

n_estimators: 300

learning_rate: 0.05

num_leaves: 31

random_state: ${seed}

verbose: -1

is_cat: true

is_scale: false

grid_params:
  model__max_depth: [3, 4, 5]
  model__n_estimators: [100, 150, 200]
  model__learning_rate: [0.01, 0.05, 0.1]
  model__num_leaves: [15, 31, 63]