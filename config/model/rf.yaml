defaults:
  - /preprocessing/encoder@encoder: ohe
  - /preprocessing/scaler@scaler: null
  - _self_

_target_: sklearn.ensemble.RandomForestClassifier

n_estimators: 300

max_depth: 8

min_samples_split: 2

random_state: ${seed}

is_cat: ${preprocessing.encode_categorical}

is_scale: false

calibration_method: ${tuning.calibration.method}

grid_params:
  model__n_estimators: [100, 300, 500]
  model__max_depth: [3, 5, 7]
  model__min_samples_split: [5, 20]
  model__min_samples_leaf: [2, 10]
  model__max_features: ["sqrt", "log2"]